[project]
name = "xianyu-auto"
version = "0.1.0"
description = "Local-first Xianyu virtual-product approval and delivery orchestrator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "lark-oapi>=1.5,<2",
  "mcp>=1.6,<2",
  "pillow>=11,<13",
  "playwright>=1.50,<2",
  "pydantic>=2.11,<3",
  "pypdf>=6,<7",
  "reportlab>=4.4,<5",
  "uvicorn>=0.35,<1",
]

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
]

[project.scripts]
xianyu-auto = "xianyu_auto.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xianyu_auto"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

